[package]
name = "rivulet-ruo"
version = "0.10.2-preview.3"
description = "Rivulet 若 · 桌面客户端"
authors = ["泥泥"]
# 核心贡献者:啵啵小C(见 CONTRIBUTORS.md)
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rivulet_ruo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
